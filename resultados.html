
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Consulta de Resultados</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  overflow: hidden;
}
header {
  background: #003366;
  color: white;
  padding: 10px;
  text-align: center;
}
.controls {
  padding: 8px;
  background: #f4f4f4;
}
.controls select, .controls input {
  width: 100%;
  padding: 8px;
  margin-bottom: 6px;
  font-size: 14px;
}
.table-wrapper { overflow-x: auto; background: #fff; }
.table-container { overflow-y: auto; }
table {
  width: 100%;
  min-width: 900px;
  border-collapse: collapse;
  font-size: 12px;
}
th, td {
  border: 1px solid #ccc;
  padding: 4px;
  text-align: center;
  white-space: nowrap;
}
th {
  background: #eee;
  position: sticky;
  top: 0;
  z-index: 2;
}
.pix {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: #fff;
  border-top: 2px solid #28a745;
  padding: 8px;
  text-align: center;
  font-size: 13px;
}
.pix-btn {
  margin-top: 6px;
  background: #28a745;
  color: white;
  border: none;
  padding: 8px 12px;
  font-size: 14px;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>

<body>

<header>
<b>Consulta de Resultados do Concurso</b>
</header>

<div class="controls">
  <select id="cargo"><option value="">Selecione o cargo</option></select>
  <select id="sre"><option value="">Selecione a SRE</option></select>
  <input type="text" id="busca" placeholder="Buscar por nome">
</div>

<div class="table-wrapper">
  <div class="table-container" id="tabelaContainer">
    <table>
      <thead>
        <tr>
          <th>CARGO</th>
          <th>SRE</th>
          <th>ORDEM</th>
          <th>NOME</th>
          <th>OBJETIVA</th>
          <th>REDAÇÃO</th>
          <th>TÍTULOS</th>
          <th>TOTAL</th>
          <th>SITUAÇÃO</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="pix">
💙 Sua doação mantém o projeto ativo e em constante melhoria.<br>
<b>Chave Pix:</b> <span id="pix-chave">pauloguimor@yahoo.com.br</span><br>
<button class="pix-btn" onclick="copiarPix()">COPIAR CHAVE PIX</button>
</div>

<script>
let dados = [];

function ajustarAltura() {
  const h = document.querySelector("header").offsetHeight;
  const c = document.querySelector(".controls").offsetHeight;
  const p = document.querySelector(".pix").offsetHeight;
  document.getElementById("tabelaContainer").style.height =
    (window.innerHeight - h - c - p) + "px";
}
window.addEventListener("load", ajustarAltura);
window.addEventListener("resize", ajustarAltura);

function copiarPix() {
  navigator.clipboard.writeText(
    document.getElementById("pix-chave").innerText
  ).then(() => alert("PIX copiado!"));
}

fetch("CSV.csv")
.then(r => r.text())
.then(txt => {
  const linhas = txt.trim().split("\n");
  const cab = linhas[0].split(",");
  dados = linhas.slice(1).map(l => {
    const c = l.split(",");
    let obj = {};
    cab.forEach((h,i)=> obj[h]=c[i]);
    return obj;
  });

  const cargos = [...new Set(dados.map(d => d.CARGO))].sort();
  const sres = [...new Set(dados.map(d => d.SRE))].sort();

  const selCargo = document.getElementById("cargo");
  cargos.forEach(c => selCargo.innerHTML += `<option value="${c}">${c}</option>`);

  const selSre = document.getElementById("sre");
  sres.forEach(s => selSre.innerHTML += `<option value="${s}">${s}</option>`);
});

document.getElementById("cargo").addEventListener("change", render);
document.getElementById("sre").addEventListener("change", render);
document.getElementById("busca").addEventListener("keyup", render);

function render() {
  const cargo = document.getElementById("cargo").value;
  const sre = document.getElementById("sre").value;
  const nome = document.getElementById("busca").value.toLowerCase();
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  dados.filter(d =>
    (!cargo || d.CARGO === cargo) &&
    (!sre || d.SRE === sre) &&
    (!nome || d.NOME.toLowerCase().includes(nome))
  ).forEach(d => {
    tbody.innerHTML += `<tr>
      <td>${d.CARGO}</td>
      <td>${d.SRE}</td>
      <td>${d.ORDEM}</td>
      <td>${d.NOME}</td>
      <td>${d.OBJETIVA}</td>
      <td>${d.REDACAO}</td>
      <td>${d.TITULOS}</td>
      <td>${d.TOTAL}</td>
      <td>${d.SITUACAO}</td>
    </tr>`;
  });
}
</script>

</body>
</html>

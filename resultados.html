<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultados – SEE/MG</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8}
header,footer{position:fixed;left:0;right:0;background:#0b3c6d;color:#fff;z-index:10}
header{top:0;padding:15px;text-align:center;font-size:20px;font-weight:bold}
footer{bottom:0;padding:12px;text-align:center}
.container{padding:90px 10px 110px}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
select,input{padding:10px;font-size:16px;flex:1}
.table-wrap{max-height:65vh;overflow:auto;background:#fff;border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:900px}
th,td{border:1px solid #ccc;padding:8px;text-align:center;font-size:14px}
th{background:#eee;position:sticky;top:0}
.pix-btn{background:#2ecc71;color:#fff;border:none;padding:10px 16px;
border-radius:6px;font-size:16px;cursor:pointer}
@media(max-width:768px){
table{min-width:700px}
th,td{font-size:12px;padding:6px}
}
</style>
</head>
<body>

<header>Resultados – SEE/MG</header>

<div class="container">
<div class="controls">
<select id="cargo"></select>
<select id="sre"></select>
<input id="busca" placeholder="Digite o nome do candidato">
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>ORDEM</th><th>NOME</th><th>OBJETIVA</th><th>REDAÇÃO</th>
<th>TÍTULOS</th><th>TOTAL</th><th>SITUAÇÃO</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>
</div>

<footer>
💙 Sua doação mantém o projeto ativo e em constante melhoria.<br>
<strong>Chave Pix:</strong> pauloguimor@yahoo.com.br<br>
<button class="pix-btn" onclick="copiarPix()">💚 Copiar Pix</button>
</footer>

<script>
const cargos = [
"ADMINISTRATIVO_PEDAGOGICO","AEE","ARTE","ASSISTENTE_SOCIAL","ATB","BIBLIOTECARIO",
"BIOLOGIA","EDUCACAO_FISICA","EEB","ENSINO_RELIGIOSO","FILOSOFIA","FISICA",
"GEOGRAFIA","HISTORIA","INGLES","INSPETOR_ESCOLAR","MATEMATICA","NUTRICIONISTA",
"PORTUGUES","PSICOLOGO","QUIMICA","SOCIOLOGIA","TDE","TERAPEUTA_OCUPACIONAL"
];

const cargoSel=document.getElementById("cargo");
const sreSel=document.getElementById("sre");
const busca=document.getElementById("busca");
const tbody=document.getElementById("tbody");
let dados=[];

cargoSel.innerHTML='<option value="">Selecione o cargo</option>' +
cargos.map(c=>`<option value="${c}">${c.replace(/_/g," ")}</option>`).join("");

cargoSel.onchange=()=>{
if(!cargoSel.value)return;
fetch(`dados/${cargoSel.value}.csv`)
.then(r=>r.text())
.then(t=>{
const linhas=t.trim().split(/\r?\n/).map(l=>l.split(","));
const head=linhas.shift();
dados=linhas.map(l=>{
let o={}; head.forEach((h,i)=>o[h]=l[i]); return o;
});
const sres=[...new Set(dados.map(d=>d.SRE))];
sreSel.innerHTML='<option value="">Todas SREs</option>'+
sres.map(s=>`<option>${s}</option>`).join("");
render();
});
};

[sreSel,busca].forEach(e=>e.oninput=render);

function render(){
tbody.innerHTML="";
dados.filter(d=>
(!sreSel.value||d.SRE===sreSel.value)&&
d.NOME.toLowerCase().includes(busca.value.toLowerCase())
).forEach(d=>{
tbody.innerHTML+=`<tr>
<td>${d.ORDEM}</td><td>${d.NOME}</td><td>${d.OBJETIVA}</td>
<td>${d.REDACAO}</td><td>${d.TITULOS}</td>
<td>${d.TOTAL}</td><td>${d.SITUACAO}</td></tr>`;
});
}

function copiarPix(){
navigator.clipboard.writeText("pauloguimor@yahoo.com.br");
alert("Chave PIX copiada!");
}
</script>
</body>
</html>
